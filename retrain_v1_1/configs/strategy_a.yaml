study:
  name: rasnet_strategy_a_retrain_v1_1
  version: "1.1.0"
  amendment_id: "BENCHMARK_PREREGISTRATION_Section7_StrategyA"
  study_dir: "retrain_v1_1"
  dataset_root_config: "config.lab.yaml"
  splits_file: "Phase3_Local_Integration/splits_final.json"
  nnunet_v2_ref:
    model_folder: "Q1_Publication_Package/matched_200ep_benchmark/nnUNet_results/Dataset501_CoronarySeg/nnUNetTrainer_200epochs__nnUNetPlans__3d_fullres"
    fold: 0
    checkpoint_name: "checkpoint_best.pth"
    expected_checkpoint_sha256: "9accddf283b1c480e386f30f426b9200ca8d4aa1ecd70d5b5af0b8aad6058711"
  seed: 42

preprocessing:
  axis_order_monai: "XYZ"
  pixdim_xyz: [0.349609375, 0.349609375, 0.5]
  patch_size_xyz: [160, 160, 96]
  crop_foreground_hu_gt_0: false
  ct_clip_hu: [-166.0, 727.0]
  ct_mean: 147.97113
  ct_std: 179.68488
  pad_image_val: -1.747343
  pad_label_val: 0
  bg_coords_max_per_case: 50000
  cache_compression: "blosc2_zstd1"
  cache_dtype_image: "float16"
  cache_dtype_label: "uint8"

augmentations:
  flip_prob: 0.5
  affine_prob: 0.30
  rotate_range_rad: [0.2617993878, 0.2617993878, 0.2617993878]  # +/- 15 deg
  scale_range: [0.15, 0.15, 0.15]                               # [0.85, 1.15]
  gaussian_noise_prob: 0.15
  gaussian_noise_std: 0.10
  gaussian_smooth_prob: 0.15
  gaussian_smooth_sigma: [0.5, 1.0]
  scale_intensity_prob: 0.15
  scale_intensity_factors: 0.15
  adjust_contrast_prob: 0.15
  adjust_contrast_gamma: [0.7, 1.5]

training:
  epochs: 200
  steps_per_epoch: 250
  batch_size: 2
  foreground_ratio: 0.3333333333
  optimizer: "AdamW"
  lr: 3.0e-4
  weight_decay: 1.0e-5
  warmup_epochs: 5
  scheduler: "WarmupCosinePerStep"
  eta_min: 1.0e-6
  grad_clip_norm: 1.0
  amp_dtype: "bfloat16"
  val_interval_epochs: 20
  val_split: "val"
  val_sw_overlap: 0.50
  val_sw_mode: "gaussian"
  val_sw_batch_size: 4
  num_workers: 4
  min_free_disk_gb: 25.0

loss:
  name: "DiceCELoss"
  to_onehot_y: true
  softmax: true
  include_background: false
  batch: true
  ds_weights_quarter_half: [0.25, 0.50]
  ds_main_weight: 1.0
  ds_normalize_by_sum: true
  ds_gt_downsample_mode: "max_pool"

models:
  - name: "rasnet_v1_1"
    arch: "rasnet_v1_1"
    init_filters: 16
    dropout_prob: 0.1
    enable_attention: true
    enable_ds: true
    train: true
  - name: "segresnet_v1_1"
    arch: "segresnet"
    init_filters: 16
    dropout_prob: 0.1
    enable_attention: false
    enable_ds: false
    train: true
  - name: "vnet_v1_1"
    arch: "vnet"
    init_filters: 16
    dropout_prob: 0.1
    enable_attention: false
    enable_ds: false
    train: true
  - name: "ablation_no_attn_v1_1"
    arch: "rasnet_v1_1"
    init_filters: 16
    dropout_prob: 0.1
    enable_attention: false
    enable_ds: true
    train: true
  - name: "ablation_no_ds_v1_1"
    arch: "rasnet_v1_1"
    init_filters: 16
    dropout_prob: 0.1
    enable_attention: true
    enable_ds: false
    train: true
  - name: "nnunet_v2"
    arch: "nnunet_v2_frozen"
    train: false

evaluation:
  roi_size_xyz: [160, 160, 96]
  sw_overlap: 0.50
  sw_mode: "gaussian"
  sw_sigma_scale: 0.125
  sw_batch_size: 4
  tau_grid: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]
  keep_top_k: 2
  connectivity: 26
  primary_recipe: "R4_tuned_tta8_top2"
  metric_version: "surface-v1"
  bootstrap_resamples: 10000
  bootstrap_seed: 42
  ni_margin: -0.005
  timing_val_cases: 10
